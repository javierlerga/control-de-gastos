<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Gastos</title>
  <meta name="theme-color" content="#06111d">

  <!-- Icono para "Agregar a Inicio" en iPhone -->
  <link rel="apple-touch-icon" sizes="180x180"
        href="./control-de-gastos-icono-180.png?v=3">
  <link rel="icon" type="image/png"
        href="./control-de-gastos-icono-azul.png?v=3">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 25%, #0b2238 0%, #06111d 48%, #02070c 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(88vw, 430px);
      text-align: center;
      padding: 34px 18px 42px;
      box-sizing: border-box;
    }

    .logo {
      width: min(58vw, 220px);
      height: auto;
      border-radius: 22%;
      display: block;
      margin: 0 auto 22px;
      box-shadow: 0 18px 50px rgba(0,92,205,.28);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 10vw, 50px);
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 span {
      display: block;
      margin-top: 9px;
      color: #2d96ff;
      font-size: .65em;
    }

    .lema {
      margin: 22px 0 0;
      color: rgba(255,255,255,.82);
      font-size: 17px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      margin: 28px auto 0;
      border: 5px solid rgba(45,150,255,.22);
      border-top-color: #2d96ff;
      border-right-color: #147efb;
      border-radius: 50%;
      animation: giro .8s linear infinite;
    }

    .abriendo {
      margin-top: 18px;
      color: rgba(255,255,255,.8);
      font-size: 16px;
    }

    .acciones {
      margin-top: 28px;
      display: grid;
      gap: 14px;
    }

    .boton-principal {
      appearance: none;
      border: 0;
      border-radius: 18px;
      padding: 17px 22px;
      font-size: 18px;
      font-weight: 800;
      background: #147efb;
      color: #fff;
      box-shadow: 0 12px 30px rgba(20,126,251,.28);
      cursor: pointer;
    }

    .instruccion {
      margin: 0;
      color: rgba(255,255,255,.72);
      font-size: 14px;
      line-height: 1.45;
    }

    @keyframes giro {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    function abrirApp() {
      window.location.href = 'https://script.google.com/macros/s/AKfycbxYcaV2LDsxT7ElUeydxSSz3ATmYU1HjhTz_YJ0IZOy0RBWhNJexInG_r2mzKQjS2Ha/exec';
    }
  </script>
</head>

<body>
  <main class="wrap">
    <img class="logo"
         src="./control-de-gastos-icono-azul.png?v=3"
         alt="Control de Gastos">

    <h1>
      Control
      <span>de Gastos</span>
    </h1>

    <p class="lema">Organizá tus gastos. Tomá el control.</p>

    <div class="acciones">
      <button class="boton-principal" type="button" onclick="abrirApp()">
        Abrir Control de Gastos
      </button>

      <p class="instruccion">
        Para instalar el icono en iPhone: tocá Compartir y después
        “Agregar a pantalla de inicio” desde esta página.
      </p>
    </div>
  </main>
</body>
</html>
