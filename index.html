<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Gastos</title>

  <meta name="theme-color" content="#06111d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control de Gastos">

  <link rel="apple-touch-icon" sizes="180x180" href="./control-de-gastos-icono-180.png">
  <link rel="icon" type="image/png" href="./control-de-gastos-icono-azul.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:radial-gradient(circle at 50% 25%,#0b2238 0%,#06111d 48%,#02070c 100%);
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
    }
    body{
      min-height:100svh;
      display:grid;
      place-items:center
    }
    .wrap{
      width:min(88vw,430px);
      text-align:center;
      padding:34px 18px 42px;
      box-sizing:border-box
    }
    .logo{
      width:min(58vw,220px);
      height:auto;
      border-radius:22%;
      display:block;
      margin:0 auto 22px;
      box-shadow:0 18px 50px rgba(0,92,205,.28)
    }
    h1{
      margin:0;
      font-size:clamp(36px,10vw,50px);
      line-height:1;
      font-weight:900;
      text-transform:uppercase
    }
    h1 span{
      display:block;
      margin-top:9px;
      color:#2d96ff;
      font-size:.65em
    }
    .lema{
      margin:22px 0 0;
      color:rgba(255,255,255,.82);
      font-size:17px
    }
    .instalar{
      margin-top:30px;
      padding:18px;
      border:1px solid rgba(45,150,255,.35);
      border-radius:18px;
      background:rgba(255,255,255,.06);
      font-size:16px;
      line-height:1.5
    }
    .instalar strong{color:#63b5ff}
    .spinner{
      width:48px;height:48px;
      margin:28px auto 0;
      border:5px solid rgba(45,150,255,.22);
      border-top-color:#2d96ff;
      border-right-color:#147efb;
      border-radius:50%;
      animation:giro .8s linear infinite;
      display:none
    }
    .abriendo{
      display:none;
      margin-top:18px;
      color:rgba(255,255,255,.8)
    }
    body.standalone .instalar{display:none}
    body.standalone .spinner,
    body.standalone .abriendo{display:block}
    @keyframes giro{to{transform:rotate(360deg)}}
  </style>

  <script>
    function estaInstalada() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    window.addEventListener('load', function() {
      if (estaInstalada()) {
        document.body.classList.add('standalone');
        setTimeout(function() {
          window.location.replace('https://script.google.com/macros/s/AKfycbxYcaV2LDsxT7ElUeydxSSz3ATmYU1HjhTz_YJ0IZOy0RBWhNJexInG_r2mzKQjS2Ha/exec');
        }, 700);
      }
    });
  </script>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="./control-de-gastos-icono-azul.png" alt="Control de Gastos">
    <h1>Control <span>de Gastos</span></h1>
    <p class="lema">Organizá tus gastos. Tomá el control.</p>

    <div class="instalar">
      Para instalarla, tocá <strong>Compartir</strong> y después
      <strong>Agregar a Inicio</strong>.<br><br>
      Importante: hacelo desde esta página de GitHub, antes de entrar a la app.
    </div>

    <div class="spinner"></div>
    <div class="abriendo">Abriendo Control de Gastos…</div>
  </main>
</body>
</html>
