<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Gastos</title>

  <meta name="theme-color" content="#06111d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Control de Gastos">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="apple-touch-icon" sizes="180x180" href="./control-de-gastos-icono-azul.png">
  <link rel="icon" type="image/png" href="./control-de-gastos-icono-azul.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 28%, #0a2137 0%, #06111d 48%, #02070c 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
    }
    .wrap {
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: min(56vw, 230px);
      height: auto;
      border-radius: 22%;
      display: block;
      margin: 0 auto 22px;
      box-shadow: 0 18px 50px rgba(0, 92, 205, .28);
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 10vw, 50px);
      line-height: 1;
      letter-spacing: .5px;
      font-weight: 900;
      text-transform: uppercase;
    }
    h1 span {
      display: block;
      margin-top: 8px;
      color: #2d96ff;
      font-size: .65em;
      letter-spacing: 1px;
    }
    p {
      margin: 22px 0 0;
      color: rgba(255,255,255,.82);
      font-size: 17px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 30px auto 0;
      border: 5px solid rgba(45,150,255,.22);
      border-top-color: #2d96ff;
      border-right-color: #147efb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.location.replace('https://script.google.com/macros/s/AKfycbxYcaV2LDsxT7ElUeydxSSz3ATmYU1HjhTz_YJ0IZOy0RBWhNJexInG_r2mzKQjS2Ha/exec');
      }, 450);
    });
  </script>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="./control-de-gastos-icono-azul.png" alt="Control de Gastos">
    <h1>Control <span>de Gastos</span></h1>
    <p>Organizá tus gastos. Tomá el control.</p>
    <div class="spinner" aria-label="Cargando"></div>
  </main>
</body>
</html>
